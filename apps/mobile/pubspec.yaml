name: reviz
description: "Reviz — révision et correction pour les étudiants d'Afrique francophone."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.8.3+18

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Les libellés des widgets Material en français — « Annuler », « OK »,
  # les mois du sélecteur de date. Sans lui, `showDatePicker` avec une
  # locale française lève, et l'application entière parlerait anglais
  # dans ses boîtes de dialogue.
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  google_sign_in: ^7.2.0
  dio: ^5.11.1
  go_router: ^17.5.0
  flutter_riverpod: ^3.4.3
  crypto: ^3.0.7
  # Version imposée par flutter_localizations du SDK 3.44 : la contrainte
  # plus large refusait de résoudre.
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  # Les lectures gardées pour le hors-ligne (`donnees/cache.dart`) : un
  # fichier par lecture, dans le dossier de l'application.
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.1
  package_info_plus: ^10.2.1
  file_picker: ^13.1.0
  image_picker: ^1.2.3
  confetti: ^0.8.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Génère l'écran de lancement natif d'Android — celui que le système montre
  # avant que Flutter ait dessiné quoi que ce soit. Outil de génération
  # seulement : rien n'en part dans l'APK hormis les ressources qu'il écrit.
  flutter_native_splash: ^2.4.6

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/polices/OFL.txt
    # Les douze pochoirs d'avatars, 74 ko en tout. Embarqués et non
    # téléchargés : le classement et le profil doivent s'afficher hors ligne,
    # et le public a un forfait data limité. Produits par
    # `node scripts/avatars.mjs`.
    - assets/avatars/
    # Le logo, dans l'en-tête et à la connexion : la marque doit se voir dans
    # l'application, pas seulement sur l'écran d'accueil du téléphone. 30 ko.
    - assets/marque/logo.png
    # Le panthéreau en 3D, dans ses vingt et un états, en WebP 512 px.
    # Produits par `node scripts/mascotte.mjs` depuis `assets-source/mascotte/`.
    - assets/mascotte/
    # Les dix objets 3D des familles de matières, sur l'accueil et l'écran
    # d'une matière. Produits par `node scripts/matieres.mjs`.
    - assets/matieres/

  fonts:
    # Identité du 3 octobre 2026 : Fredoka pour les titres et les chiffres
    # héros, Inter pour le texte. Embarquées, et non téléchargées par
    # `google_fonts` au premier lancement : le public cible a un forfait data
    # limité et ouvre souvent l'application la nuit avant un contrôle.
    #
    # Les deux fichiers sont réduits à l'alphabet latin (`fontTools subset`) :
    #  - Fredoka figée en graisse 600, l'équivalent de l'ancienne Fredoka
    #    One : 35 ko ;
    #  - Inter variable sur l'axe `wght` (400 à 700), axe `opsz` figé à 14 :
    #    156 ko pour quatre graisses — Nunito Sans pesait 558 ko.
    # Une police est une entrée de build qui ne change jamais : la committer
    # est légitime. Licences : `assets/polices/OFL.txt`.
    - family: Fredoka
      fonts:
        - asset: assets/polices/Fredoka.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/polices/Inter.ttf
          weight: 400
        - asset: assets/polices/Inter.ttf
          weight: 500
        - asset: assets/polices/Inter.ttf
          weight: 600
        - asset: assets/polices/Inter.ttf
          weight: 700

# Écran de lancement : l'icône du panthéreau sur le crème de l'application,
# au lieu d'un écran blanc pendant que Flutter démarre — la première seconde
# que voit un étudiant. Les images sont produites par `scripts/icones.mjs` ;
# régénérer ensuite avec :
#
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FCEFD0"
  image: assets/marque/logo-objet.png
  # Android 12 et plus découpent l'image dans un disque posé sur
  # `icon_background_color` : le buste y est calé au bas du disque (voir
  # scripts/icones.mjs).
  android_12:
    color: "#FCEFD0"
    image: assets/marque/logo-lancement-a12.png
    icon_background_color: "#FFC400"
  android: true
  ios: true
  web: false
