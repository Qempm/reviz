<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Remplacé par `--base-href` : « /web/ » en production (npm run web). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Reviz dans ton navigateur : tes cours en QCM et en fiches, tes copies corrigées. Sur ordinateur et sur iPhone.">
  <meta name="theme-color" content="#FCEFD0">

  <!-- iPhone : « Sur l'écran d'accueil » ouvre Reviz comme une application.
       Sans compte développeur Apple, c'est la version iPhone de Reviz : elle
       s'installe depuis Safari, en plein écran, avec son icône. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Reviz">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Écrans de lancement de l'app installée, un par taille d'iPhone
       (`scripts/lancement-iphone.mjs`). Sans eux, iOS montre un écran blanc
       le temps que Reviz se charge. -->
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="lancement/1290x2796.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="lancement/1179x2556.png">
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="lancement/1284x2778.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="lancement/1170x2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="lancement/1125x2436.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="lancement/1242x2688.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="lancement/828x1792.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="lancement/750x1334.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Reviz</title>

  <style>
    /* Ce que l'étudiant voit pendant que l'application se télécharge — sur
       une 3G, plusieurs secondes. Retiré dès la première image de Flutter
       (flutter_bootstrap.js). Les couleurs sont celles de l'application. */
    html, body { margin: 0; height: 100%; background: #FCEFD0; }
    #chargement {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #4A4F4C; font-size: 15px;
    }
    #chargement img { width: 88px; height: 88px; border-radius: 22px; }
    #chargement .barre {
      width: 120px; height: 6px; border-radius: 3px; background: #EADBB4; overflow: hidden;
    }
    #chargement .barre::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 3px;
      background: #FFC400; animation: aller 1.1s ease-in-out infinite alternate;
    }
    @keyframes aller { from { transform: translateX(-10%); } to { transform: translateX(160%); } }

    /* L'invitation à installer, sur iPhone, dans Safari seulement (pas dans
       l'app déjà installée). Hors de Flutter : elle doit marcher même si le
       moteur tarde. */
    #installer {
      position: fixed; left: 12px; right: 12px; z-index: 1000;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      max-width: 440px; margin: 0 auto; box-sizing: border-box;
      background: #FFFFFF; color: #101818; border-radius: 24px; padding: 18px 18px 14px;
      box-shadow: 0 24px 48px -16px rgba(16,24,24,.35), 0 4px 12px rgba(16,24,24,.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transform: translateY(140%); transition: transform .45s cubic-bezier(.2,1.2,.4,1);
    }
    #installer.visible { transform: none; }
    #installer .tete { display: flex; gap: 12px; align-items: center; }
    #installer .tete img { width: 48px; height: 48px; border-radius: 12px; flex: none; }
    #installer h2 { margin: 0; font-size: 18px; line-height: 1.2; }
    #installer p { margin: 2px 0 0; font-size: 14px; color: #4A4F4C; line-height: 1.35; }
    #installer ol { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 15px; }
    #installer li { display: flex; gap: 10px; align-items: center; }
    #installer li b.n {
      flex: none; width: 26px; height: 26px; border-radius: 50%; background: #FFC400;
      display: grid; place-items: center; font-size: 14px;
    }
    #installer svg { width: 18px; height: 18px; vertical-align: -3px; }
    #installer button {
      margin-top: 12px; width: 100%; height: 44px; border: 0; border-radius: 14px;
      background: #FCEFD0; color: #101818; font-size: 15px; font-weight: 600;
    }
    #installer .fleche {
      position: absolute; left: 50%; bottom: -9px; width: 18px; height: 18px; margin-left: -9px;
      background: #FFFFFF; transform: rotate(45deg); border-radius: 3px;
    }
    @media (prefers-reduced-motion: reduce) {
      #chargement .barre::after { animation: none; width: 100%; }
      #installer { transition: none; }
    }
  </style>
</head>
<body>
  <div id="chargement" role="status">
    <img src="icons/Icon-192.png" alt="">
    <div class="barre" aria-hidden="true"></div>
    <span>Reviz se prépare…</span>
  </div>
  <noscript>
    <p style="font-family: sans-serif; text-align: center; padding: 24px">
      Reviz a besoin de JavaScript pour s’ouvrir dans le navigateur.
    </p>
  </noscript>

  <div id="installer" role="dialog" aria-labelledby="installer-titre" hidden>
    <div class="tete">
      <img src="icons/apple-touch-icon.png" alt="">
      <div>
        <h2 id="installer-titre">Installe Reviz sur ton iPhone</h2>
        <p>Une icône sur ton écran d’accueil, en plein écran, et tes cours même sans réseau.</p>
      </div>
    </div>
    <ol>
      <li><b class="n">1</b><span>Touche <svg viewBox="0 0 24 24" fill="none" stroke="#101818" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Partager"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11v9h12v-9"/></svg> <b>Partager</b> <span id="installer-ou">en bas de l’écran</span></span></li>
      <li><b class="n">2</b><span>Choisis <b>« Sur l’écran d’accueil »</b></span></li>
      <li><b class="n">3</b><span>Touche <b>« Ajouter »</b></span></li>
    </ol>
    <button type="button" id="installer-plus-tard">Plus tard</button>
    <div class="fleche" id="installer-fleche"></div>
  </div>

  <script>
    // Le service worker : l'application se garde sur le téléphone, et s'ouvre
    // ensuite sans réseau (sw.js).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        // Portée « /web » et non « /web/ » : c'est là que vit la page
        // (next.config.mjs). En développement, la base est « / ».
        var portee = new URL('.', document.baseURI).pathname.replace(/\/$/, '') || '/';
        navigator.serviceWorker.register('sw.js', { scope: portee }).catch(function () {});
      });
    }

    // Appelé quand Reviz a dessiné sa première image : le service worker
    // garde le moteur de rendu (CanvasKit) et les polices que la page vient
    // de charger. Sans eux, l'application gardée ne pourrait pas se dessiner
    // hors ligne.
    window.revizGarderMoteur = function () {
      if (!('serviceWorker' in navigator) || !window.performance) return;
      navigator.serviceWorker.ready.then(function (r) {
        var urls = performance.getEntriesByType('resource')
          .map(function (e) { return e.name; })
          .filter(function (u) { return /flutter-canvaskit|fonts\.gstatic\.com|fonts\.googleapis\.com/.test(u); });
        if (urls.length && r.active) r.active.postMessage({ type: 'garder-moteur', urls: urls });
      }).catch(function () {});
    };

    // L'invitation à installer : iPhone ou iPad, dans le navigateur (pas
    // dans l'app installée), et pas plus d'une fois tous les sept jours.
    (function () {
      var ua = navigator.userAgent;
      var ios = /iPhone|iPad|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var installee = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      if (!ios || installee) return;
      var cle = 'reviz.installer.plus-tard';
      try {
        var le = Number(localStorage.getItem(cle) || 0);
        if (Date.now() - le < 7 * 24 * 3600 * 1000) return;
      } catch (e) {}

      var carte = document.getElementById('installer');
      // Chrome et Firefox sur iPhone placent « Partager » en haut, dans la
      // barre d'adresse ; Safari, en bas.
      if (/CriOS|FxiOS|EdgiOS/.test(ua)) {
        document.getElementById('installer-ou').textContent = 'dans la barre d’adresse';
        document.getElementById('installer-fleche').style.display = 'none';
      }
      document.getElementById('installer-plus-tard').addEventListener('click', function () {
        try { localStorage.setItem(cle, String(Date.now())); } catch (e) {}
        carte.classList.remove('visible');
        setTimeout(function () { carte.hidden = true; }, 500);
      });
      setTimeout(function () {
        carte.hidden = false;
        requestAnimationFrame(function () { carte.classList.add('visible'); });
      }, 2500);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
