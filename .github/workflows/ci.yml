name: Intégration continue

# Les tests existaient ; rien ne les exécutait.
#
# Au moment de l'audit, le dépôt portait 148 tests Vitest tous verts, et le
# seul workflow présent poussait les migrations Supabase. Personne ne pouvait
# donc savoir qu'une régression avait cassé quelque chose avant de le
# découvrir à la main — et `npm run lint` échouait depuis le premier jour,
# faute de fichier de configuration ESLint, sans que cela se voie.
#
# Trois vérifications, qui tournent en parallèle : le serveur Next.js,
# l'application Flutter, et la cohérence des types générés depuis la base.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une nouvelle poussée sur une branche annule la vérification en cours : seul
# le dernier état compte.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Serveur Next.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Le build après les tests : une erreur de type ou un test rouge se lit
      # plus vite qu'un échec de compilation Next.js.
      #
      # Les clés sont factices — le build ne fait aucun appel réseau, mais les
      # modules qui lisent l'environnement au chargement refuseraient de
      # s'initialiser sans elles. Aucune valeur réelle n'a sa place ici : ce
      # journal est public sur un dépôt public.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-anonyme-de-build
          SUPABASE_SERVICE_ROLE_KEY: cle-de-service-de-build

  mobile:
    name: Application Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Installer
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      # Les tests de rendu mesurent le débordement horizontal à 375 puis
      # 320 px : c'est là qu'ils attrapent ce qu'aucun coup d'œil ne voit.
      - name: Tests
        run: flutter test

  types:
    name: Types Supabase à jour
    runs-on: ubuntu-latest
    # Sans les secrets de la base, ce contrôle ne peut pas tourner : il est
    # donc réservé aux poussées sur le dépôt lui-même. Une pull request venue
    # d'un fork n'y a pas accès, et échouerait pour une raison qui ne la
    # concerne pas.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Installer
        run: npm ci

      - name: Lier le projet
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # `lib/supabase/database.types.ts` est engagé dans le dépôt. S'il diffère
      # de ce que la base rend, une migration est passée sans que les types
      # suivent — et le code compile contre une base qui n'existe plus.
      - name: Comparer les types engagés à la base
        run: npm run db:types:check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
